<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예약 문의 관리 | 풀향기 펜션</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="nav-wrap">
    <a class="logo" href="index.html">풀향기<span> 펜션</span></a>
  </div>
</header>

<div class="admin-shell">

  <div id="loginCard" class="admin-card">
    <h2>관리자 로그인</h2>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-small">로그인</button>
      <p id="loginStatus" class="form-note" style="margin-top:12px;"></p>
    </form>
  </div>

  <div id="listWrap" class="admin-list-wrap" style="display:none;">
    <div class="admin-table-wrap">
      <div class="top-bar">
        <h2>예약 문의 목록</h2>
        <button id="logoutBtn" class="btn btn-small">로그아웃</button>
      </div>
      <div id="tableHolder"></div>
    </div>

    <div class="admin-table-wrap">
      <div class="top-bar">
        <h2>예약 마감 날짜 관리</h2>
      </div>
      <p class="form-note" style="margin-bottom:16px;">날짜를 클릭하면 마감/해제가 토글됩니다.</p>
      <div class="room-toggle" id="blockToggle">
        <button type="button" class="active" data-room="small">작은 방</button>
        <button type="button" data-room="large">큰 방</button>
      </div>
      <div id="blockCalendar" class="calendar"></div>
      <p id="blockStatus" class="form-note" style="margin-top:12px;"></p>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="calendar.js"></script>
<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const ROOM_LABELS = { small: '작은 방', large: '큰 방' };

  const loginCard = document.getElementById('loginCard');
  const listWrap = document.getElementById('listWrap');
  const loginForm = document.getElementById('loginForm');
  const loginStatus = document.getElementById('loginStatus');
  const tableHolder = document.getElementById('tableHolder');
  const logoutBtn = document.getElementById('logoutBtn');

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function formatDate(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
  }

  async function loadReservations() {
    const { data, error } = await supabaseClient
      .from('reservations')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      tableHolder.innerHTML = `<p class="admin-empty">목록을 불러오지 못했습니다: ${escapeHtml(error.message)}</p>`;
      return;
    }

    if (!data || data.length === 0) {
      tableHolder.innerHTML = '<p class="admin-empty">아직 접수된 문의가 없습니다.</p>';
      return;
    }

    const rows = data.map((r) => `
      <tr>
        <td>${formatDate(r.created_at)}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${escapeHtml(r.phone)}</td>
        <td>${r.room ? escapeHtml(ROOM_LABELS[r.room] || r.room) : '-'}</td>
        <td>${r.checkin_date ? escapeHtml(r.checkin_date) : '-'}</td>
        <td>${r.nights ? escapeHtml(r.nights) + '박' : '-'}</td>
        <td>${r.guests ? escapeHtml(r.guests) + '명' : '-'}</td>
        <td>${r.message ? escapeHtml(r.message) : '-'}</td>
        <td><button type="button" class="btn btn-small cancel-btn"
          data-id="${escapeHtml(r.id)}" data-room="${escapeHtml(r.room || '')}"
          data-checkin="${escapeHtml(r.checkin_date || '')}" data-nights="${escapeHtml(r.nights || '')}">취소</button></td>
      </tr>
    `).join('');

    tableHolder.innerHTML = `
      <table class="reservations-table">
        <thead>
          <tr>
            <th>접수시각</th><th>이름</th><th>연락처</th><th>객실</th><th>희망 체크인</th><th>숙박</th><th>인원</th><th>문의내용</th><th>취소</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  tableHolder.addEventListener('click', async (e) => {
    const btn = e.target.closest('.cancel-btn');
    if (!btn) return;
    const { id, room, checkin, nights } = btn.dataset;

    if (!confirm('이 예약을 취소할까요? 막아둔 날짜도 함께 풀립니다.')) return;

    btn.disabled = true;
    btn.textContent = '취소 중...';

    const { error: delResError } = await supabaseClient.from('reservations').delete().eq('id', id);
    if (delResError) {
      alert('취소 실패: ' + delResError.message);
      btn.disabled = false;
      btn.textContent = '취소';
      return;
    }

    if (room && checkin && nights) {
      const [y, m, d] = checkin.split('-').map(Number);
      const dates = [];
      for (let i = 0; i < Number(nights); i++) {
        const dt = new Date(y, m - 1, d + i);
        dates.push(calDateStr(dt.getFullYear(), dt.getMonth(), dt.getDate()));
      }
      await supabaseClient.from('blocked_dates').delete().eq('room', room).in('date', dates);
    }

    loadReservations();
    loadBlockedDates();
  });

  // --- Blocked dates management ---
  const blockedByRoom = { small: new Set(), large: new Set() };
  let currentBlockRoom = 'small';
  const blockToggle = document.getElementById('blockToggle');
  const blockCalendarEl = document.getElementById('blockCalendar');
  const blockStatus = document.getElementById('blockStatus');
  let blockCalendar = null;

  async function loadBlockedDates() {
    const { data, error } = await supabaseClient.from('blocked_dates').select('room,date');
    blockedByRoom.small = new Set();
    blockedByRoom.large = new Set();
    if (error) {
      blockStatus.textContent = '마감 날짜를 불러오지 못했습니다: ' + error.message;
      return;
    }
    (data || []).forEach((row) => {
      if (blockedByRoom[row.room]) blockedByRoom[row.room].add(row.date);
    });
    if (blockCalendar) blockCalendar.setBlockedDates(blockedByRoom[currentBlockRoom]);
  }

  async function toggleBlockedDate(dateStr) {
    const isBlocked = blockedByRoom[currentBlockRoom].has(dateStr);
    blockStatus.textContent = '저장 중...';

    if (isBlocked) {
      const { error } = await supabaseClient
        .from('blocked_dates')
        .delete()
        .eq('room', currentBlockRoom)
        .eq('date', dateStr);
      if (error) {
        blockStatus.textContent = '해제 실패: ' + error.message;
        return;
      }
      blockedByRoom[currentBlockRoom].delete(dateStr);
    } else {
      const { error } = await supabaseClient
        .from('blocked_dates')
        .insert({ room: currentBlockRoom, date: dateStr });
      if (error) {
        blockStatus.textContent = '마감 처리 실패: ' + error.message;
        return;
      }
      blockedByRoom[currentBlockRoom].add(dateStr);
    }

    blockStatus.textContent = '';
    blockCalendar.setBlockedDates(blockedByRoom[currentBlockRoom]);
  }

  blockToggle.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => {
      blockToggle.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentBlockRoom = btn.dataset.room;
      blockCalendar.setBlockedDates(blockedByRoom[currentBlockRoom]);
    });
  });

  function showLoggedIn() {
    loginCard.style.display = 'none';
    listWrap.style.display = 'flex';
    loadReservations();

    if (!blockCalendar) {
      blockCalendar = createCalendar({
        container: blockCalendarEl,
        blockedDates: blockedByRoom[currentBlockRoom],
        mode: 'admin',
        onDayClick: toggleBlockedDate,
      });
    }
    loadBlockedDates();
  }

  function showLoggedOut() {
    loginCard.style.display = 'block';
    listWrap.style.display = 'none';
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginStatus.textContent = '로그인 중...';
    const email = loginForm.email.value.trim();
    const password = loginForm.password.value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      loginStatus.textContent = '로그인에 실패했습니다: ' + error.message;
      return;
    }
    loginStatus.textContent = '';
    showLoggedIn();
  });

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    showLoggedOut();
  });

  (async () => {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
      showLoggedIn();
    } else {
      showLoggedOut();
    }
  })();
</script>

</body>
</html>
